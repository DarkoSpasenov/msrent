name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # one-time commit of the former site's photos
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Importer les photos de l'ancien site (une seule fois)
        if: hashFiles('content/legacy-photos.json') != ''
        run: |
          node scripts/import-legacy-photos.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A content public/photos
            git commit -m "Import des photos de l'ancien site"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      # With a custom domain (CNAME file) the site is served at the root of that domain,
      # whatever configure-pages reports.
      - name: Adresse du site
        id: site
        run: |
          if [ -s CNAME ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "url=https://$(tr -d '[:space:]' < CNAME)" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire le site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
